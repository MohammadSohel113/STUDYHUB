{% extends "base.html" %}
{% block title %}Sign Up • STUDYHUB{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth-card">
  <div class="auth-icon">✦</div><h1>Create your account</h1><p>Start your programming journey with STUDYHUB.</p>
  <form method="post">
    <label>Full Name</label><input name="name" required placeholder="Your name">
    <label>Email</label><input type="email" name="email" required placeholder="you@example.com">
    <label>Password</label><input type="password" name="password" required placeholder="Minimum 6 characters">
    <label>Confirm Password</label><input type="password" name="confirm" required placeholder="Repeat password">
    <button class="btn full">Create Account</button>
  </form>
  <p class="switch">Already have an account? <a href="{{ url_for('signin') }}">Sign in</a></p>
</div></div>
{% endblock %}
